; Resident ID uploads
;
; The registration form accepts a photograph or scan of a valid ID up to 5MB,
; and the same limit applies to the ID a resident replaces after signing up.
; PHP rejects an oversized upload before the request ever reaches Laravel, so
; the resident sees "the file failed to upload" rather than the validation
; message naming the size - which is why this has to be at least as large as
; the max:5120 rule in App\Http\Requests\Auth\RegisterRequest.
;
; HEADROOM: 8M and 12M against a 5MB file, because post_max_size has to cover
; the multipart envelope - the file plus every other field in the form, the
; boundary markers and the headers - not just the file. A post_max_size equal
; to the file limit rejects a 5MB upload, because the total is always larger.
;
; NOT HONOURED BY `php artisan serve`, which runs the file through PHP's built-in
; server and reads php.ini rather than this file. During local development the
; same two values have to be set in the php.ini that `artisan serve` is using,
; or uploads above 2M will fail no matter what is written here:
;
;   php -i | grep upload_max_filesize      # find the ini actually loaded
;
; This file is for the real web server, which does read it.
upload_max_filesize = 8M
post_max_size = 12M
